name: Translator private static package

# One full delivery only. Account owner confirmed Actions+Packages storage
# 0 GB / 0.5 GB on 2026-10-23. Do not rerun after a successful upload without
# checking remaining shared allowance / expiration of the previous artifact.
# Upload only the precompressed ZIP and small extras, never dist/ or payload/.
on:
  workflow_dispatch:
  push:
    branches: [feature/voice-translator-mvp]
    paths: [.github/workflows/translator-private-package.yml]

permissions:
  contents: read

concurrency:
  group: translator-private-static-package
  cancel-in-progress: false

jobs:
  package:
    if: >-
      github.repository == 'dar4med/sokuji' &&
      github.ref == 'refs/heads/feature/voice-translator-mvp' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/web-translator
        shell: bash
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      OMP_NUM_THREADS: '2'
    steps:
      - name: Checkout this exact source revision without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the tested Node version without dependency cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Set up the tested Python version without dependency cache
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.14

      - name: Check standard runner browser and fictional-audio prerequisites
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          "$CHROMIUM_PATH" --version
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          if ! ffmpeg -hide_banner -filters 2>&1 | grep ' flite '; then
            echo '::error title=Audio fixture prerequisite::FFmpeg with the flite filter is required; no model download or upload has started.'
            exit 1
          fi

      - name: Install only the prototype's locked dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          python3 -m venv .tools/model-tools
          .tools/model-tools/bin/pip install --no-cache-dir -r scripts/model-requirements.txt -c scripts/model-constraints.txt

      - name: Reproduce the existing pinned models without refreshing the lock
        run: |
          set -euo pipefail
          .tools/model-tools/bin/python scripts/prepare-models.py --locked
          python3 scripts/verify-models.py
          git diff --exit-code

      - name: Copy pinned runtime and licenses, build TypeScript and static assets
        run: |
          set -euo pipefail
          npm run assets
          npm run build
          python3 scripts/verify-models.py --directory dist

      - name: Logic, real browser Basic Auth and portable payload, CSP, offline helper
        run: |
          set -euo pipefail
          npm test
          npm run preview > "$RUNNER_TEMP/translator-preview.log" 2>&1 &
          translator_preview_pid=$!
          trap 'kill "$translator_preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5180/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5180/ > /dev/null
          npm run test:csp
          npm run test:auth
          node scripts/delivery-helper-test.mjs
          git diff --exit-code

      - name: Package verified payload and verify complete ZIP extraction and SHA-256
        run: |
          set -euo pipefail
          python3 scripts/package-private.py --output-dir "$RUNNER_TEMP/translator-packages"
          python3 scripts/prepare-delivery.py --package-output "$RUNNER_TEMP/translator-packages" --delivery-dir "$RUNNER_TEMP/translator-delivery"
          {
            printf 'Source SHA: %s\n\n' "$GITHUB_SHA"
            cat "$RUNNER_TEMP"/translator-packages/*.zip.delivery.json
            printf '\nDelivery checksums:\n\n'
            cat "$RUNNER_TEMP/translator-delivery/SUMY-DOSTAWY.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ONE precompressed delivery, expire after one day
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: translator-private-static-${{ github.sha }}
          path: ${{ runner.temp }}/translator-delivery/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: false
